[package]
name = "clinic-desktop"
version = "0.1.0"
description = "Clinic Management desktop shell"
authors = ["Levo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clinic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12+ resolves any unknown asset path to `index.html` (see `src/lib.rs`),
# which is what makes client-side routing survive a reload.
tauri = { version = "2.12", features = [] }
tauri-plugin-store = "2.5"
# Desktop Google sign-in: the browser returns to the app over `clinic://`.
# Single-instance must forward a second launch's URL to the running window.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
# `tauri::generate_context!()` expands to `::serde_json` paths.
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
