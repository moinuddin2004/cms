# Local/self-hosted stack. Copy backend/.env.example to backend/.env first.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["5000:5000"]
  web:
    build: ./web-app
    # nginx serves the static SPA on port 80 inside the container.
    ports: ["3000:80"]
    depends_on: [backend]
