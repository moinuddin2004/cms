server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Fingerprinted build output (JS/CSS/fonts) never changes: cache it forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routing (history mode): unknown paths boot the SPA, which then
  # routes on the client. Without this a reload of /patients/123 would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The entry document must always be revalidated, otherwise a deploy keeps
  # pointing browsers at asset hashes from the previous build.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;
}
